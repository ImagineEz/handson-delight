modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_url}/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="${mod_url}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farmersdelight"
    mandatory=true
    versionRange="${farmers_delight_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="diegesis"
    mandatory=true
    versionRange="${diegesis_version_range}"
    ordering="AFTER"
    side="BOTH"

# Both mods patch the same pot. Optional means absent is fine, but an installed upstream version must fail validation.
[[dependencies.${mod_id}]]
    modId="handson_delight"
    mandatory=false
    versionRange="[0]"
    ordering="NONE"
    side="BOTH"
