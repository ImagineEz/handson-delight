name: Forge build and GameTests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Freeform Delight
        uses: actions/checkout@v4
        with:
          path: fork
          persist-credentials: false

      - name: Check out the matching Diegesis release
        uses: actions/checkout@v4
        with:
          repository: Pocky-l/diegesis
          ref: v1.0.0-beta.17
          path: diegesis
          persist-credentials: false

      - name: Set up Java 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Build and run the Forge GameTests
        working-directory: fork
        run: bash gradlew --no-daemon --no-configuration-cache -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 :forge:build :forge:runGameTestServer

      - name: Upload the Forge mod
        uses: actions/upload-artifact@v4
        with:
          name: freeform-delight-forge-1.20.1
          path: |
            fork/forge/build/libs/*.jar
            !fork/forge/build/libs/*-sources.jar
            !fork/forge/build/libs/*-javadoc.jar
          if-no-files-found: error
